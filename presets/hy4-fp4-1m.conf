# Hy4-Flash: FP4 prompt experts, one slot x 1,048,576 (experimental).
# Requires patch 0003 (the FP4 prompt path), applied by install-basalt.sh. One real 1M session at
# a time; the other requests queue.
#
# Built and measured on the pinned c771c0a7 (+ patches 0001/0003/0004/0005). GB10, 121 GiB unified,
# 77.84 GiB of experts resident:
#   33k prompt    HTTP 200, 46.0 s  (~656 tok/s) with the pinned chunk policy (8k above 262k per slot)
#   620k prompt   does NOT complete here: the pool runs out around 300-370k tokens and the engine
#                 ends (the stall seen earlier was this memory wall, not a CUDA race). --kv fp8
#                 halves the latent caches and does not change the outcome at 600k on this box.
# Quality trade: KLD 0.22542 / top-1 85.40 % against MMQ 0.20460 / 86.22 % (33k reference).
#
# For a longer prompt add "--kv fp8" to ARGS (halves the latent cache bytes; see the ceiling above).
MODEL=hy4
DESC=experimental FP4 prompt experts, 1 slot x 1048576 (needs patch 0003)
ARGS=--parallel 1 --max-context 1048576
ENV=BASALT_FP4_PROMPT=1
