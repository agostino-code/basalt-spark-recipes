# Hy4-Flash: one slot x 524,288, fp8 KV, FP4 prompt experts (one-term W4A4). The fp8 KV halves the
# latent caches (~45 -> ~22 GiB at 524k) and the FP4 prompt path speeds the prompt's expert products
# (~20% in the prototype: 33k 24.8 s vs MMQ 31.4 s, 222k 237.5 s vs 270 s); it does not reduce the
# experts' memory, so it does not move the box's memory ceiling. Needs patch 0003 (install-basalt.sh
# applies it; PR #793, draft).
#
# Quality trade: KLD 0.22542 / top-1 85.40 % against MMQ 0.20460 / 86.22 %; fp8 KV on its own costs
# PPL 17.6522 / KLD 0.20744 / top-1 86.30 % against fp16 17.5207 / 0.20300 / 86.32 %.
#
# Measured on this box, same shape (8k chunks, fp8 KV, prompt cache off, 30,022-token prompt):
#   first request  59.2 s against MMQ's 80.2 s (the one-time kernel warm-up dominates both)
#   warm           39.2 s against MMQ's 44.9 s; the MoE slice 8.2 s against 14.2 s (-42%), i.e. -13%
#   the first token matches the MMQ run ('We', greedy)
# A full 524k prompt is NOT measured: the prompt path runs out of memory around 300k tokens
# (docs/deep-opt-plan.md), and FP4 does not change that (it is the prompt's math, not the experts'
# residency). Experimental, not the default.
MODEL=hy4
DESC=1 slot x 524288, fp8 KV, FP4 prompt experts - experimental long window
ARGS=--parallel 1 --max-context 524288 --kv fp8
ENV=BASALT_FP4_PROMPT=1
