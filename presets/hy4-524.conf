# Hy4-Flash: one slot x 524,288, fp8 KV. A 524k window needs the latent caches halved: with 77.84 GiB of
# experts resident, a 121 GiB GB10 cannot back 524k fp16 rows (~45 GiB) beside them, while fp8 brings
# that to ~22 GiB. The fp8 KV quality cost, measured on the four-slot lane: PPL 17.6522 / KLD 0.20744 /
# top-1 86.30 % against fp16's 17.5207 / 0.20300 / 86.32 %.
#
# Measured on this box: a 33k prompt passes (HTTP 200, 46.0 s, 656 tok/s). A full 524k prompt is NOT
# measured — the prompt path runs out of memory around 300k tokens (docs/deep-opt-plan.md) — so this is
# the memory-lean long-window shape, not a validated 524k run.
MODEL=hy4
DESC=1 slot x 524288, fp8 KV - memory-lean long window
ARGS=--parallel 1 --max-context 524288 --kv fp8
