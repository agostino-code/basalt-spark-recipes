# Hy4-Flash: FP4 prompt experts, one-term W4A4 (experimental).
# The FP4 prefill path lives in the local prototype engine build, not in the 0.5.7 base: on a
# stock install BASALT_FP4_PROMPT is ignored and the normal MMQ experts run. Use the prototype
# tree (BASALT_DIR=/tmp/basalt-install-test) until the FP4 patch is in the installer.
# Measured with the prototype: 33k 24.8 s vs MMQ 31.4 s, 222k 237.5 s vs 270 s, 620k one slot
# 1222.7 s vs 1325.4 s. Quality gate: KLD 0.22542 / top-1 85.40 % against MMQ 0.20460 / 86.22 %.
# The 4-bit activation trade makes this experimental, not the default.
MODEL=hy4
DESC=experimental FP4 prompt experts (one-term; needs the FP4 engine build)
ARGS=--parallel 4 --max-context 1048576
ENV=BASALT_FP4_PROMPT=1
