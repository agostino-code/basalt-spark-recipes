# Hy4-Flash: FP4 prompt experts, one-term W4A4 (experimental).
# Requires patch 0003 (the FP4 prompt path), which install-basalt.sh applies. On a 0.5.7 tree
# without the patch BASALT_FP4_PROMPT is ignored and the normal MMQ experts run.
# Measured with patch 0003: 33k 24.8 s vs MMQ 31.4 s, 222k 237.5 s vs 270 s, 620k one slot
# 1222.7 s vs 1325.4 s. Quality gate: KLD 0.22542 / top-1 85.40 % against MMQ 0.20460 / 86.22 %.
# The 4-bit activation trade makes this experimental, not the default.
MODEL=hy4
DESC=experimental FP4 prompt experts (one-term; needs patch 0003)
ARGS=--parallel 4 --max-context 1048576
ENV=BASALT_FP4_PROMPT=1
